[package]
name = "meeting-notes"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "meeting_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
meeting-notes-core = { path = "../crates/meeting-notes-core" }
meeting-notes-audio = { path = "../crates/meeting-notes-audio" }
meeting-notes-transcription = { path = "../crates/meeting-notes-transcription" }
meeting-notes-summary = { path = "../crates/meeting-notes-summary" }
meeting-notes-storage = { path = "../crates/meeting-notes-storage" }
tauri-plugin-dialog = "2.7.2"

# Needed to auto-grant the WebKitGTK microphone permission request, which is
# denied by default because wry's webkitgtk backend installs no handler.
# The version is pinned to what wry already resolves to so that only one
# webkit2gtk (and therefore one `WebView` type) exists in the graph.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "=2.0.2", features = ["v2_40"] }

[dev-dependencies]
hound = "3.5.1"

